<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Amina Kip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
</header>
<main class="container py-5">
    <h1>Projects</h1>
    <div class="row g-4 mt-2">
        <div class="col-md-4" th:each="project : ${projects}">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${project.title}">Title</h2>
                    <p class="card-text" th:text="${project.description}">Description</p>
                    <p>
                        <span class="badge text-bg-secondary me-1" th:each="tech : ${project.techStack}" th:text="${tech}">Tech</span>
                    </p>
                    <a class="btn btn-sm btn-outline-primary" th:href="${project.link}">View project</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Amina Kip</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
