<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <!-- Alert: shown only when a flash message is present -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}">Message</div>

    <div th:each="post : ${posts}">
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">
                    <span th:text="${post.title}">Title</span>
                    <!-- Badge: shows the post's category -->
                    <span class="badge bg-secondary" th:text="${post.category}">Category</span>
                </h5>

                <button type="button" class="btn btn-outline-danger btn-sm"
                        data-bs-toggle="modal" th:data-bs-target="'#deleteModal-' + ${post.id}">
                    Delete
                </button>

                <!-- Modal: delete confirmation -->
                <div class="modal fade" th:id="'deleteModal-' + ${post.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirm delete</h5>
                            </div>
                            <div class="modal-body">
                                Delete "<span th:text="${post.title}">Title</span>"? This cannot be undone.
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                                    <button type="submit" class="btn btn-danger">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Post pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/posts(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${p == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/posts(page=${p})}" th:text="${p}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/posts(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
