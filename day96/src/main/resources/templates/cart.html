<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Lexend:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../static/css/soko.css" th:href="@{/css/soko.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">The Shop</a>
    </div>
</nav>
<main class="container py-4" style="max-width: 700px;">
    <h1 class="mb-4">Your Cart</h1>

    <p th:if="${cart.empty}" id="empty-cart-message" class="text-muted">Your cart is empty.</p>

    <table class="table" th:unless="${cart.empty}">
        <thead>
        <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${cart.items}">
            <td th:text="${entry.value.product.name}">Product</td>
            <td>$<span th:text="${#numbers.formatDecimal(entry.value.product.priceDollars, 1, 2)}">0.00</span></td>
            <td>
                <form th:action="@{'/cart/update/' + ${entry.key}}" method="post" class="d-flex gap-1">
                    <input type="number" name="quantity" th:value="${entry.value.quantity}" min="1" class="form-control form-control-sm" style="width:70px;">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Update</button>
                </form>
            </td>
            <td>$<span th:text="${#numbers.formatDecimal(entry.value.subtotalDollars, 1, 2)}">0.00</span></td>
            <td>
                <form th:action="@{'/cart/remove/' + ${entry.key}}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:unless="${cart.empty}" class="d-flex justify-content-between align-items-center">
        <h4>Total: $<span id="cart-total" th:text="${#numbers.formatDecimal(cart.totalDollars, 1, 2)}">0.00</span></h4>
        <a class="btn btn-success" href="/checkout">Proceed to Checkout</a>
    </div>
</main>
</body>
</html>
