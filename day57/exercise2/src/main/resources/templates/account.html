<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" href="../static/css/kadi.css" th:href="@{/css/kadi.css}">
</head>
<body>
    <!-- th:if / th:unless -->
    <div th:if="${loggedIn}">
        <p>Welcome back!</p>
    </div>
    <div th:unless="${loggedIn}">
        <p>Please log in</p>
    </div>

    <!-- th:switch / th:case -->
    <div th:switch="${role}">
        <p th:case="'ADMIN'">You have administrator access.</p>
        <p th:case="'MEMBER'">You have member access.</p>
        <p th:case="*">You are browsing as a guest.</p>
    </div>

    <!-- A complex condition: both parts must hold -->
    <div th:if="${loggedIn and balance >= 100}">
        <p>Premium badge unlocked!</p>
    </div>
</body>
</html>
