<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Variable expression -->
    <title th:text="${title}">Default Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" href="../static/css/kadi.css" th:href="@{/css/kadi.css}">
</head>
<body>
    <!-- Variable expression -->
    <h1 th:text="${title}">Default Title</h1>

    <!-- Text expression: string concatenation with a variable -->
    <p th:text="'Hello, ' + ${name} + '!'">Hello, User!</p>

    <!-- Attribute expression: builds a URL from a path variable with @{...} -->
    <a th:href="@{/profile/{id}(id=${profileId})}" th:text="'View profile ' + ${profileId}">View profile</a>
</body>
</html>
