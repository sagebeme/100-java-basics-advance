<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Lexend:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../static/css/soko.css" th:href="@{/css/soko.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">The Shop</a>
        <a class="btn btn-outline-light btn-sm" href="/cart">View Cart</a>
    </div>
</nav>
<main class="container py-4">
    <h1 class="mb-4">Products</h1>
    <div class="row g-3">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${product.name}">Name</h2>
                    <p class="card-text" th:text="${product.description}">Description</p>
                    <p class="fw-bold">$<span th:text="${#numbers.formatDecimal(product.priceDollars, 1, 2)}">0.00</span></p>
                    <form th:action="@{'/cart/add/' + ${product.id}}" method="post" class="d-flex gap-2">
                        <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm" style="width:70px;">
                        <button type="submit" class="btn btn-primary btn-sm">Add to cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
