<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Top 10 Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="container mt-4">
        <h1>My Top 10 Movies</h1>
        <p class="lead">A ranked list of favorites, kept in a real database.</p>
    </header>

    <main class="container">
        <!-- Semantic list, not a div soup: an ordered list because rank is meaningful order -->
        <ol class="list-group" aria-label="Top ten ranked movies">
            <li class="list-group-item" th:each="movie : ${movies}">
                <span th:text="${movie.title}">Title</span>
                (<span th:text="${movie.year}">2020</span>) -
                <span th:text="${movie.director}">Director</span> -
                <span aria-label="rating out of ten">Rating: <span th:text="${movie.rating}">10</span>/10</span>
            </li>
        </ol>

        <form th:action="@{/movies}" th:object="${movie}" method="post" class="row g-3 mt-4" aria-label="Add a new movie">
            <div class="col-md-4">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label for="director" class="form-label">Director</label>
                <input type="text" id="director" th:field="*{director}" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label for="year" class="form-label">Year</label>
                <input type="number" id="year" th:field="*{year}" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label for="rating" class="form-label">Rating</label>
                <input type="number" id="rating" th:field="*{rating}" class="form-control" min="1" max="10" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Add Movie</button>
            </div>
        </form>
    </main>

    <!-- defer: the page's own content and form work without waiting on this -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
