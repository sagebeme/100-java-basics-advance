<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maktaba · Your loan</title>
    <link rel="stylesheet" href="../static/css/maktaba.css" th:href="@{/css/maktaba.css}">
</head>
<body>
<header><a href="/"><h1>Maktaba</h1></a><p>The community library, Kibera</p></header>
<main>
    <section class="slip" id="slip">
        <p>Enjoy <strong id="loan-title" th:text="${loan.bookTitle}">Title</strong>!</p>
        <p>Your loan code is <span class="code" id="loan-code" th:text="${loan.code}">MK-1-1001</span></p>
        <p>Please bring it back by <strong id="due" th:text="${due}">a date</strong>.</p>
        <a class="button" href="/" id="back">Back to the shelves</a>
    </section>
</main>
</body>
</html>
