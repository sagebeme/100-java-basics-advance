<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mtaa News</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:wght@400;600&display=swap">
    <link rel="stylesheet" href="../static/css/gazeti.css" th:href="@{/css/gazeti.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/posts}">Mtaa News</a>
        </div>
    </nav>

    <!-- Already written: every story, each with a short excerpt and a link to the whole thing. -->
    <main class="container my-4">
        <article class="card mb-3" th:each="post : ${posts}">
            <div class="card-body">
                <h2 class="h4 card-title"><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Title</a></h2>
                <p class="text-muted small" th:text="|${post.author} · ${#temporals.format(post.date, 'd MMMM yyyy')}|">Author · date</p>
                <p class="card-text" th:text="${T(com.learning.PostService).excerpt(post.body, 120)}">Excerpt…</p>
            </div>
        </article>
    </main>
</body>
</html>
