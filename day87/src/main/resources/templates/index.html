<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nairobi Cafe Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        #map { height: 350px; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body>
<header class="bg-dark text-white py-3">
    <div class="container">
        <h1 class="h4 mb-0">Nairobi Cafe Finder</h1>
    </div>
</header>
<main class="container py-4">
    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/}">
        <div class="col-md-4">
            <label for="location" class="form-label">Search by name or area</label>
            <input type="text" class="form-control" id="location" name="location" th:value="${location}" placeholder="e.g. Westlands">
        </div>
        <div class="col-md-2">
            <label for="minRating" class="form-label">Min rating</label>
            <input type="number" step="0.1" min="0" max="5" class="form-control" id="minRating" name="minRating" th:value="${minRating}">
        </div>
        <div class="col-md-2">
            <label for="maxPrice" class="form-label">Max price</label>
            <select class="form-select" id="maxPrice" name="maxPrice">
                <option value="">Any</option>
                <option th:each="level : ${priceLevels}" th:value="${level}" th:text="${level.symbol}"
                        th:selected="${maxPrice != null and maxPrice == level}"></option>
            </select>
        </div>
        <div class="col-md-2 form-check ms-2">
            <input type="checkbox" class="form-check-input" id="wifiOnly" name="wifiOnly" value="true" th:checked="${wifiOnly}">
            <label class="form-check-label" for="wifiOnly">Wifi only</label>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <div id="map" class="mb-4"></div>

    <p th:if="${cafes.isEmpty()}" id="no-results" class="text-muted">No cafes match your search.</p>

    <div class="row g-3">
        <div class="col-md-4" th:each="cafe : ${cafes}">
            <div class="card h-100 cafe-card">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${cafe.name}">Cafe name</h2>
                    <p class="card-subtitle text-muted mb-2" th:text="${cafe.address}">Address</p>
                    <p class="mb-1">
                        <span th:text="${cafe.priceLevel.symbol}">$$</span>
                        &middot; Rating: <span th:text="${cafe.rating}">4.0</span>/5
                        &middot; <span th:text="${cafe.hasWifi} ? 'Wifi available' : 'No wifi'">Wifi</span>
                    </p>
                    <p class="card-text" th:text="${cafe.description}">Description</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const cafes = /*[[${cafes}]]*/ [];
    /*]]>*/

    const map = L.map('map').setView([-1.2833, 36.8167], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    cafes.forEach(cafe => {
        L.marker([cafe.latitude, cafe.longitude])
            .addTo(map)
            .bindPopup(`<strong>${cafe.name}</strong><br>${cafe.address}<br>Rating: ${cafe.rating}/5`);
    });
</script>
</body>
</html>
