<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${post.title} · Mtaa News|">Story · Mtaa News</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:wght@400;600&display=swap">
    <link rel="stylesheet" href="../static/css/gazeti.css" th:href="@{/css/gazeti.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/posts}">Mtaa News</a>
        </div>
    </nav>

    <main class="container my-4">
        <article>
            <h1 th:text="${post.title}">Title</h1>
            <p class="text-muted" th:text="|By ${post.author} · ${#temporals.format(post.date, 'd MMMM yyyy')}|">By author · date</p>
            <p th:each="paragraph : ${post.paragraphs}" th:text="${paragraph}">A paragraph.</p>
        </article>
        <a th:href="@{/posts}">← All stories</a>
    </main>
</body>
</html>
