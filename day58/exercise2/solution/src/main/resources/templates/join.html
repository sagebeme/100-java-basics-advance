<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join the co-op</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Karla:wght@400;700&display=swap">
    <link rel="stylesheet" href="../static/css/mavuno.css" th:href="@{/css/mavuno.css}">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/prices}">Mavuno Farmers' Co-op</a>
        </div>
    </nav>

    <main class="container my-4">
        <h1>Join the co-op</h1>
        <form method="post" th:action="@{/join}" class="row g-3" novalidate>
            <div class="col-12 col-md-6">
                <label for="name" class="form-label">Full name</label>
                <input type="text" id="name" name="name" class="form-control"
                       th:value="${name}" th:classappend="${errors.containsKey('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${errors.containsKey('name')}" th:text="${errors.name}">Name error</div>
            </div>
            <div class="col-12 col-md-6">
                <label for="phone" class="form-label">M-Pesa number</label>
                <input type="tel" id="phone" name="phone" class="form-control"
                       th:value="${phone}" th:classappend="${errors.containsKey('phone')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${errors.containsKey('phone')}" th:text="${errors.phone}">Phone error</div>
            </div>
            <div class="col-12 col-md-6">
                <label for="county" class="form-label">County</label>
                <select id="county" name="county" class="form-select"
                        th:classappend="${errors.containsKey('county')} ? 'is-invalid'">
                    <option value="">Choose…</option>
                    <option th:each="c : ${counties}" th:value="${c}" th:text="${c}" th:selected="${c == county}">Meru</option>
                </select>
                <div class="invalid-feedback" th:if="${errors.containsKey('county')}" th:text="${errors.county}">County error</div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Join</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
