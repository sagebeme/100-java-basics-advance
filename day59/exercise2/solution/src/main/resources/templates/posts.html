<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor's desk · Mtaa News</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:wght@400;600&display=swap">
    <link rel="stylesheet" href="../static/css/gazeti.css" th:href="@{/css/gazeti.css}">
</head>
<body>
<main class="container mt-4">
    <h1>Editor's desk</h1>

    <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}">Message</div>

    <!-- Already written: a card per story, with a section badge and a delete button that opens a
         confirmation dialog. The dialog's form POSTs to /posts/{id}/delete. -->
    <div class="card mb-3" th:each="post : ${posts}">
        <div class="card-body d-flex justify-content-between align-items-start gap-3">
            <div>
                <h2 class="h5 card-title mb-1" th:text="${post.title}">Title</h2>
                <span class="badge text-bg-secondary" th:text="${post.section}">News</span>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" th:data-bs-target="|#delete-${post.id}|">Delete</button>
        </div>
        <div class="modal fade" th:id="|delete-${post.id}|" tabindex="-1" th:aria-labelledby="|delete-title-${post.id}|" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title h5" th:id="|delete-title-${post.id}|">Delete this story?</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">"<span th:text="${post.title}">Title</span>" will be gone for good.</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Keep it</button>
                        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav aria-label="Story pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/posts(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${p == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/posts(page=${p})}" th:text="${p}"
                   th:attr="aria-current=${p == currentPage} ? 'page'">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/posts(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
