# Netlify: the course website is a Next.js app in site/, exported to plain static files. The build
# reads the day folders' READMEs from the rest of the repo.
[build]
  base = "site"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"   # a static export needs no Next.js server runtime
