<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <title>Sales Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Sales Analytics Dashboard</h1>
        <span class="text-muted" id="last-updated">Last updated: <span th:text="${lastUpdated}">--:--:--</span> (auto-refreshes every 30s)</span>
    </div>

    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/}">
        <div class="col-auto">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
            </select>
        </div>
        <div class="col-auto">
            <label for="region" class="form-label">Region</label>
            <select class="form-select" id="region" name="region">
                <option value="">All regions</option>
                <option th:each="r : ${regions}" th:value="${r}" th:text="${r}" th:selected="${r == region}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Apply Filters</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/export(category=${category},region=${region},format='csv')}">Export CSV</a>
            <a class="btn btn-outline-secondary" th:href="@{/export(category=${category},region=${region},format='json')}">Export JSON</a>
        </div>
    </form>

    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6 text-muted">Total Revenue</h2>
                    <p class="display-6 mb-0" id="total-revenue">KES <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 0)}">0</span></p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6 text-muted">Matching Records</h2>
                    <p class="display-6 mb-0" id="record-count" th:text="${recordCount}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6">Revenue by Category</h2>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6">Revenue by Region</h2>
                    <canvas id="regionChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6">Revenue Over Time</h2>
                    <canvas id="monthChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const categoryData = /*[[${revenueByCategory}]]*/ {};
    const regionData = /*[[${revenueByRegion}]]*/ {};
    const monthData = /*[[${revenueByMonth}]]*/ {};
    /*]]>*/

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(categoryData),
            datasets: [{ label: 'Revenue (KES)', data: Object.values(categoryData), backgroundColor: '#3B6EA5' }]
        }
    });

    new Chart(document.getElementById('regionChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(regionData),
            datasets: [{ data: Object.values(regionData), backgroundColor: ['#3B6EA5', '#A53B6E', '#6EA53B', '#E5A93B'] }]
        }
    });

    new Chart(document.getElementById('monthChart'), {
        type: 'line',
        data: {
            labels: Object.keys(monthData),
            datasets: [{ label: 'Revenue (KES)', data: Object.values(monthData), borderColor: '#3B6EA5', fill: false, tension: 0.2 }]
        }
    });
</script>
</body>
</html>
