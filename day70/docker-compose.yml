services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=day70
      - DB_USER=day70
      - DB_PASSWORD=day70
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    environment:
      - POSTGRES_DB=day70
      - POSTGRES_USER=day70
      - POSTGRES_PASSWORD=day70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day70"]
      interval: 2s
      timeout: 3s
      retries: 10
