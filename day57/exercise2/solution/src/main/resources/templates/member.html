<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${member.name}">Member</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" href="../static/css/kadi.css" th:href="@{/css/kadi.css}">
    <style>.out { color: #b03a2e; }</style>
</head>
<body>
    <h1 th:text="${member.name}">Member name</h1>

    <div th:switch="${member.role}">
        <p th:case="'CHAIR'">Chairperson: you can approve loans.</p>
        <p th:case="'TREASURER'">Treasurer: you can record contributions.</p>
        <p th:case="*">Member</p>
    </div>

    <p th:text="|Savings: KES ${#numbers.formatInteger(member.savings, 1, 'COMMA')}|">Savings: KES 0</p>

    <p th:if="${member.monthsSaving >= 6}"
       th:text="|You can borrow up to KES ${#numbers.formatInteger(member.loanLimit, 1, 'COMMA')}.|">You can borrow.</p>
    <p th:unless="${member.monthsSaving >= 6}"
       th:text="|You can borrow after 6 months of saving. ${6 - member.monthsSaving} to go.|">Not yet.</p>

    <h2>Statement</h2>
    <p th:if="${#lists.isEmpty(member.statement)}">No transactions yet.</p>
    <table th:unless="${#lists.isEmpty(member.statement)}">
        <thead>
            <tr><th>#</th><th>Date</th><th>What</th><th>KES</th></tr>
        </thead>
        <tbody>
            <tr th:each="entry, row : ${member.statement}" th:classappend="${entry.shillings < 0} ? 'out'">
                <td th:text="${row.count}">1</td>
                <td th:text="${entry.date}">2026-10-31</td>
                <td th:text="${entry.what}">Monthly saving</td>
                <td th:text="${#numbers.formatInteger(entry.shillings, 1, 'COMMA')}">3,000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
