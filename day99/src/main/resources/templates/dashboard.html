<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Advanced Analytics</h1>
        <a class="btn btn-outline-primary" href="/report">Download Report (PDF)</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h6 text-muted">Total Revenue</h2>
            <p class="display-6" id="total-revenue">KES <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 0)}">0</span></p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h6">Revenue: Actual vs. Forecast</h2>
            <canvas id="forecastChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h2 class="h6">Insights</h2>
            <ul id="insights-list">
                <li th:each="insight : ${insights}" th:text="${insight}">insight</li>
            </ul>
        </div>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const monthlyTotals = /*[[${monthlyTotals}]]*/ {};
    const forecast = /*[[${forecast}]]*/ {};
    /*]]>*/

    const actualLabels = Object.keys(monthlyTotals);
    const forecastLabels = Object.keys(forecast);
    const allLabels = actualLabels.concat(forecastLabels);

    const actualData = actualLabels.map(k => monthlyTotals[k]);
    // Forecast dataset is null for historical months (so it only draws from the last actual
    // month onward), then the projected values - this is what makes the two lines connect.
    const forecastData = new Array(actualLabels.length - 1).fill(null)
        .concat([actualData[actualData.length - 1]])
        .concat(forecastLabels.map(k => forecast[k]));

    new Chart(document.getElementById('forecastChart'), {
        type: 'line',
        data: {
            labels: allLabels,
            datasets: [
                { label: 'Actual Revenue (KES)', data: actualData.concat(new Array(forecastLabels.length).fill(null)), borderColor: '#3B6EA5', fill: false, tension: 0.2 },
                { label: 'Forecast (KES)', data: forecastData, borderColor: '#A53B6E', borderDash: [6, 4], fill: false, tension: 0.2 }
            ]
        }
    });
</script>
</body>
</html>
