<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Top 10 Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>My Top 10 Movies</h1>
        <ol>
            <li th:each="movie : ${movies}">
                <span th:text="${movie.title}">Title</span>
                (<span th:text="${movie.year}">2020</span>) -
                <span th:text="${movie.director}">Director</span> -
                Rating: <span th:text="${movie.rating}">10</span>
            </li>
        </ol>

        <form th:action="@{/movies}" th:object="${movie}" method="post">
            <input type="text" th:field="*{title}" placeholder="Title">
            <input type="text" th:field="*{director}" placeholder="Director">
            <input type="number" th:field="*{year}" placeholder="Year">
            <input type="number" th:field="*{rating}" placeholder="Rating">
            <button type="submit" class="btn btn-primary">Add Movie</button>
        </form>
    </div>
</body>
</html>
