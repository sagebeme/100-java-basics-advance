<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">Order History</h1>

    <p th:if="${orders.isEmpty()}" class="text-muted">No orders yet.</p>

    <table class="table" th:unless="${orders.isEmpty()}">
        <thead><tr><th>ID</th><th>Email</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.customerEmail}">email</td>
            <td>$<span th:text="${#numbers.formatDecimal(order.totalDollars, 1, 2)}">0.00</span></td>
            <td>
                <span class="badge" th:classappend="${order.status.name() == 'PAID'} ? 'bg-success' : 'bg-danger'" th:text="${order.status}">STATUS</span>
            </td>
            <td><a th:href="@{'/orders/' + ${order.id}}">View</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
