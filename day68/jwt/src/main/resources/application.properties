spring.application.name=tikiti
server.port=8068

# The key that signs access tokens. 32+ random bytes, from an environment variable in real life:
#   TIKITI_JWT_SECRET=$(openssl rand -base64 32) mvn spring-boot:run
# Anyone with this key can mint a token for any user, so it never goes in Git. This default is for running locally only.
tikiti.jwt.secret=${TIKITI_JWT_SECRET:local-dev-only-secret-change-me-0123456789}
