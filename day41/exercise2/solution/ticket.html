<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matatu ticket · Kangemi to Town</title>
    <link rel="stylesheet" href="ticket.css">
</head>
<body>
    <article class="ticket">
        <header>
            <p class="sacco">Mwamba Sacco</p>
            <h1>Kangemi → Town</h1>
        </header>
        <dl class="details">
            <div><dt>Route</dt><dd>23</dd></div>
            <div><dt>Fare</dt><dd>KES 80</dd></div>
            <div><dt>Seat</dt><dd>4</dd></div>
            <div><dt>Time</dt><dd>7:42am</dd></div>
        </dl>
        <p class="stamp">Paid · M-Pesa</p>
        <footer>
            <p>Keep this ticket until you alight. <a href="#">Lost something?</a></p>
        </footer>
    </article>
</body>
</html>
