<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 500px;">
    <h1 class="mb-4">Checkout</h1>

    <p class="alert alert-info">
        This uses a simulated payment gateway (no real charge is made). Try card
        <code>4242 4242 4242 4242</code> for an approved payment, or
        <code>4000 0000 0000 0002</code> to see a decline.
    </p>

    <h4>Total: $<span th:text="${#numbers.formatDecimal(cart.totalDollars, 1, 2)}">0.00</span></h4>

    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label for="cardNumber" class="form-label">Card number</label>
            <input type="text" class="form-control" id="cardNumber" th:field="*{cardNumber}">
            <div class="text-danger" th:if="${#fields.hasErrors('cardNumber')}" th:errors="*{cardNumber}"></div>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label for="expiryMonth" class="form-label">Expiry month</label>
                <input type="number" class="form-control" id="expiryMonth" th:field="*{expiryMonth}">
            </div>
            <div class="col mb-3">
                <label for="expiryYear" class="form-label">Expiry year</label>
                <input type="number" class="form-control" id="expiryYear" th:field="*{expiryYear}">
            </div>
            <div class="col mb-3">
                <label for="cvv" class="form-label">CVV</label>
                <input type="text" class="form-control" id="cvv" th:field="*{cvv}">
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Pay now</button>
    </form>
</main>
</body>
</html>
