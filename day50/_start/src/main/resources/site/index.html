<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mtaa · Log in (practice site)</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap">
<h1>mtaa<span>.</span></h1>
<p>A practice social site. Log in with <strong>demo</strong> / <strong>practice</strong>.</p>
<form class="box" id="login">
    <label for="username">Username</label><input id="username" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <button id="sign-in" type="submit">Log in</button>
    <p id="login-error" class="error" role="alert"></p>
</form>
</main>
<script>
document.getElementById('login').onsubmit = e => {
    e.preventDefault();
    if (document.getElementById('username').value === 'demo' && document.getElementById('password').value === 'practice') {
        sessionStorage.setItem('user', 'demo');
        location.href = '/feed.html';
    } else {
        document.getElementById('login-error').textContent = 'Wrong username or password.';
    }
};
</script></body></html>
