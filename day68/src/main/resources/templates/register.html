<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title>    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap">
    <link rel="stylesheet" href="../static/css/ngome.css" th:href="@{/css/ngome.css}">
</head>
<body>
    <form th:action="@{/register}" method="post">
        <p th:if="${error}" class="error" role="alert" th:text="${error}">That username is taken.</p>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" th:value="${username}" autocomplete="username" required>
        <label for="password">Password (at least 8 characters)</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Register</button>
    </form>
</body>
</html>
