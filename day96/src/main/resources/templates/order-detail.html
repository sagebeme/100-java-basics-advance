<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 600px;">
    <h1 class="mb-4">Order #<span th:text="${order.id}">1</span></h1>

    <p>
        Status:
        <span id="order-status" class="badge"
              th:classappend="${order.status.name() == 'PAID'} ? 'bg-success' : 'bg-danger'"
              th:text="${order.status}">STATUS</span>
    </p>
    <p>Email: <span th:text="${order.customerEmail}">email</span></p>
    <p th:if="${order.transactionId != null}">Transaction ID: <span th:text="${order.transactionId}">tx</span></p>

    <table class="table">
        <thead><tr><th>Product</th><th>Qty</th><th>Subtotal</th></tr></thead>
        <tbody>
        <tr th:each="item : ${order.lineItems}">
            <td th:text="${item.productName}">Product</td>
            <td th:text="${item.quantity}">1</td>
            <td>$<span th:text="${#numbers.formatDecimal(item.subtotalCents / 100.0, 1, 2)}">0.00</span></td>
        </tr>
        </tbody>
    </table>

    <h4>Total: $<span th:text="${#numbers.formatDecimal(order.totalDollars, 1, 2)}">0.00</span></h4>

    <a class="btn btn-outline-primary" href="/">Back to shop</a>
</main>
</body>
</html>
