<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .swatch { height: 150px; border-radius: 0.5rem 0.5rem 0 0; }
    </style>
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 800px;">
    <h1 class="mb-4">Color Palette Generator</h1>

    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/}">
        <div class="col-auto">
            <label for="baseColor" class="form-label">Base color</label>
            <input type="color" class="form-control form-control-color" id="baseColor" name="baseColor" th:value="${baseColor}">
        </div>
        <div class="col-auto">
            <label for="scheme" class="form-label">Scheme</label>
            <select class="form-select" id="scheme" name="scheme">
                <option th:each="s : ${schemes}" th:value="${s}" th:text="${s}" th:selected="${s == scheme}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Generate</button>
        </div>
    </form>

    <div class="row g-3 mb-4" id="palette">
        <div class="col" th:each="color : ${palette}">
            <div class="card">
                <div class="swatch" th:style="'background-color:' + ${color.toHex()}"></div>
                <div class="card-body text-center p-2">
                    <code class="hex-code" th:text="${color.toHex()}">#000000</code>
                    <button type="button" class="btn btn-sm btn-link copy-btn" th:attr="data-hex=${color.toHex()}">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <a class="btn btn-outline-secondary" th:href="@{/export(baseColor=${baseColor},scheme=${scheme},format='css')}">Export CSS</a>
        <a class="btn btn-outline-secondary" th:href="@{/export(baseColor=${baseColor},scheme=${scheme},format='json')}">Export JSON</a>
    </div>
</main>

<script>
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const hex = btn.getAttribute('data-hex');
            navigator.clipboard.writeText(hex).then(() => {
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = original; }, 1000);
            });
        });
    });
</script>
</body>
</html>
