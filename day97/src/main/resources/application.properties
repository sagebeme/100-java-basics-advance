# The token you type into Meta's dashboard when registering the webhook, and the app secret Meta
# signs every webhook with. Set the real ones as environment variables; never commit them.
# The defaults below only make the app start on your laptop.
whatsapp.webhook.verify-token=${WHATSAPP_VERIFY_TOKEN:test-verify-token-123}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:dev-only-app-secret}
