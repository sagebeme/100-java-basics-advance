name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  exercises:
    name: Every exercise (solution passes, starter fails)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache JavaFX jars
        uses: actions/cache@v4
        with:
          path: .cache/javafx
          key: javafx-21.0.7
      - name: Check every exercise
        run: bash tools/check-exercises.sh

  day70-image:
    name: Day 70 Docker image runs as a normal user and answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t day70 day70
      - name: Runs as uid 10001, not root
        run: docker run --rm --entrypoint id day70 | tee /dev/stderr | grep -q 'uid=10001'
      - name: Health check answers OK
        run: |
          docker run -d --name day70 -p 8080:8080 day70
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/health | grep -q OK; then echo healthy; exit 0; fi
            sleep 2
          done
          docker logs day70
          exit 1

  site:
    name: Course website builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # next/font downloads the Google fonts at build time, and that download sometimes fails on
      # the runner ("next/font/google queries have exactly one entry"); one retry gets past it.
      - run: npm run build || (echo "Retrying after a font download failure"; rm -rf .next; npm run build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
