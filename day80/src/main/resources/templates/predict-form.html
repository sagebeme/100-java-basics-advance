<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
</head>
<body>
<header>
    <h1>House Price Predictor</h1>
</header>
<main>
    <form th:action="@{/predict}" th:object="${houseFeaturesForm}" method="post">
        <div>
            <label for="squareFeet">Square feet</label>
            <input type="number" step="1" id="squareFeet" th:field="*{squareFeet}">
        </div>
        <div>
            <label for="bedrooms">Bedrooms</label>
            <input type="number" step="1" id="bedrooms" th:field="*{bedrooms}">
        </div>
        <div>
            <label for="bathrooms">Bathrooms</label>
            <input type="number" step="1" id="bathrooms" th:field="*{bathrooms}">
        </div>
        <div>
            <label for="ageYears">Age (years)</label>
            <input type="number" step="1" id="ageYears" th:field="*{ageYears}">
        </div>
        <button type="submit">Predict price</button>
    </form>

    <p id="prediction-result" th:if="${predictedPrice != null}">
        Predicted price: <span th:text="${#numbers.formatDecimal(predictedPrice, 1, 2)}"></span>
    </p>
</main>
</body>
</html>
