<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="../static/css/daftari.css" th:href="@{/css/daftari.css}">
</head>
<body>
<main class="container py-4" style="max-width: 600px;">
    <h1 class="mb-4">Todo List</h1>

    <form th:action="@{/todos}" method="post" class="d-flex gap-2 mb-4">
        <input type="text" name="title" class="form-control" placeholder="What needs doing?" aria-label="New todo" required maxlength="200">
        <button type="submit" class="btn btn-primary">Add</button>
    </form>
    <p id="error" class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>

    <div class="btn-group mb-3" role="group">
        <a class="btn btn-outline-secondary" th:classappend="${filter.name() == 'ALL'} ? 'active'" th:href="@{/(filter='ALL')}">All</a>
        <a class="btn btn-outline-secondary" th:classappend="${filter.name() == 'ACTIVE'} ? 'active'" th:href="@{/(filter='ACTIVE')}">Active</a>
        <a class="btn btn-outline-secondary" th:classappend="${filter.name() == 'COMPLETED'} ? 'active'" th:href="@{/(filter='COMPLETED')}">Completed</a>
    </div>

    <p th:if="${todos.isEmpty()}" id="empty-message" class="text-muted">Nothing here.</p>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="todo : ${todos}">
            <form th:action="@{'/todos/' + ${todo.id} + '/toggle'}" method="post" class="d-flex align-items-center gap-2 flex-grow-1 mb-0">
                <input type="hidden" name="filter" th:value="${filter}">
                <input type="checkbox" class="form-check-input" onchange="this.form.submit()" th:checked="${todo.completed}">
                <span th:text="${todo.title}" th:classappend="${todo.completed} ? 'text-decoration-line-through text-muted'">Title</span>
            </form>
            <form th:action="@{'/todos/' + ${todo.id} + '/delete'}" method="post" class="mb-0">
                <input type="hidden" name="filter" th:value="${filter}">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
