<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 600px;">
    <h1 class="mb-4">Earnings Prediction System</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h6 text-muted">Model Evaluation (held-out test set)</h2>
            <p class="mb-0" id="model-metrics">
                R&sup2;: <span th:text="${#numbers.formatDecimal(metrics.r2(), 1, 3)}">0</span> &middot;
                MAE: KES <span th:text="${#numbers.formatDecimal(metrics.mae(), 1, 0)}">0</span> &middot;
                MSE: <span th:text="${#numbers.formatDecimal(metrics.mse(), 1, 0)}">0</span>
                (trained on <span th:text="${metrics.trainSize()}">0</span> rows, evaluated on <span th:text="${metrics.testSize()}">0</span>)
            </p>
        </div>
    </div>

    <form th:action="@{/predict}" th:object="${earningsRequest}" method="post">
        <div class="mb-3">
            <label for="experience" class="form-label">Years of experience</label>
            <input type="number" step="1" class="form-control" id="experience" th:field="*{experience}">
        </div>
        <div class="mb-3">
            <label for="education" class="form-label">Education</label>
            <select class="form-select" id="education" th:field="*{education}">
                <option th:each="opt : ${educationOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <select class="form-select" id="location" th:field="*{location}">
                <option th:each="opt : ${locationOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="industry" class="form-label">Industry</label>
            <select class="form-select" id="industry" th:field="*{industry}">
                <option th:each="opt : ${industryOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Predict Earnings</button>
    </form>

    <div class="alert alert-success mt-4" id="prediction-result" th:if="${result != null}">
        <h2 class="h5">Predicted annual earnings: KES <span th:text="${#numbers.formatDecimal(result.predictedEarnings(), 1, 0)}">0</span></h2>
        <p class="mb-0">Confidence: <span th:text="${#numbers.formatDecimal(result.confidence() * 100, 1, 1)}">0</span>% &middot; Model version <span th:text="${result.modelVersion()}">1.0</span></p>
    </div>
</main>
</body>
</html>
